<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
    <h1>Table</h1>

    <!-- Example 1: Basic structure of table -->
     <table>
        <thead>
            <tr>
                <th>Employee Id</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>12</td>
                <td>Shanee</td>
            </tr>
                <td>14</td>
                <td>Michael</td>
        </tbody>
     </table>

<!-- Example 2: colspan and rowspan-->

<h2>Weekly Schedule</h2>
<p>colspan marge cells horizontally. rowspan merges cells vertically</p>

<table>
    <thead>
        <tr>
            <th colspan="3">Weekend Shifts</th>
        </tr>
        <tr>
            <th>Employee</th>
            <th>Saturday</th>
            <th>Sunday</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="2">Bill Evans</td>
            <td>Morning</td>
            <td>Off</td>
        </tr>
        <tr>
            <td>Off</td>
            <td>Evening</td>
        </tr>
        <tr>
        <tr>Laura Matt</tr>
        <tr>Evening</tr>
        <tr>Morning</tr>
    </tbody>
</table>

</body>
</html>
